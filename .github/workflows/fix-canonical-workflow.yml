name: One-time canonical workflow fixes
on:
  push:
    branches: [feature/canonical-record-workflow]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/canonicalRecord.ts'); s=p.read_text()
          s=s.replace('[...new Set([...input.supportingEvidenceIds, ...input.contraryEvidenceIds])]', 'Array.from(new Set([...input.supportingEvidenceIds, ...input.contraryEvidenceIds]))')
          s=s.replace('[...new Set(input.sourceRecordIds)]', 'Array.from(new Set(input.sourceRecordIds))')
          s=s.replace('const allEvidence = [...new Set([...input.supportingEvidenceIds, ...input.contraryEvidenceIds])];', 'const allEvidence = Array.from(new Set([...input.supportingEvidenceIds, ...input.contraryEvidenceIds]));')
          p.write_text(s)

          p=Path('client/src/pages/RecordWorkspace.tsx'); s=p.read_text()
          s=s.replace('const tabs = ["Overview", "Question", "Sources", "Evidence", "Claims", "Findings", "Unknowns"] as const;', 'const tabs = ["Overview", "Question", "Sources", "Evidence", "Claims", "Findings", "Unknowns", "Activity"] as const;')
          s=s.replace('const unknowns = trpc.canonical.unknowns.list.useQuery({ recordId: selectedId ?? 0 }, { enabled: Boolean(selectedId && isAuthenticated) });', 'const unknowns = trpc.canonical.unknowns.list.useQuery({ recordId: selectedId ?? 0 }, { enabled: Boolean(selectedId && isAuthenticated) });\n  const audit = trpc.canonical.audit.list.useQuery({ recordId: selectedId ?? 0 }, { enabled: Boolean(selectedId && isAuthenticated) });')
          needle='{tab === "Unknowns" && <ListSection title="Unknowns / unresolved questions"'
          activity='''{tab === "Activity" && <ListSection title="Activity / Audit History" action="" onAction={() => undefined} icon={<CircleHelp className="h-4 w-4" />}><div className="space-y-2">{(audit.data ?? []).map(item => <div key={item.id} className="rounded-lg border bg-white p-3 text-sm"><div className="flex flex-wrap justify-between gap-2"><strong>{item.action}</strong><span className="text-xs text-stone-500">{item.entityType} #{item.entityId} · {new Date(item.occurredAt).toLocaleString()}</span></div><p className="mt-1 text-stone-600">{item.summary}</p></div>)}{!audit.data?.length && <Empty text="No canonical audit events yet." />}</div></ListSection>}\n\n          '''
          if 'Activity / Audit History' not in s: s=s.replace(needle, activity+needle)
          p.write_text(s)

          p=Path('server/canonicalRecord.ts'); s=p.read_text()
          if 'assertFindingSavePolicy' not in s:
              s=s.replace('import { canonicalAuditEvents } from "../drizzle/canonicalAudit";\n', 'import { canonicalAuditEvents } from "../drizzle/canonicalAudit";\nimport { assertFindingSavePolicy } from "./canonicalPolicy";\n')
          s=s.replace('if (input.epistemicCategory === "FACT" && input.supportingEvidenceIds.length === 0) throw new TRPCError({ code: "BAD_REQUEST", message: "A FACT finding requires at least one linked source-backed supporting evidence item." });', 'try { assertFindingSavePolicy(input.epistemicCategory, input.supportingEvidenceIds.length); } catch (error) { throw new TRPCError({ code: "BAD_REQUEST", message: error instanceof Error ? error.message : "Invalid finding policy." }); }')
          p.write_text(s)

          Path('.github/workflows/fix-canonical-workflow.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: harden canonical workflow validation"
          git push
