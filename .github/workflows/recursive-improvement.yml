name: Recursive Evidence Improvement

on:
  pull_request:
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  push:
    branches: [main]
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-improvement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/evidenceIntegrity/recursiveImprovement.test.ts
      - run: pnpm exec tsc --noEmit
