name: Recursive Evidence Improvement

on:
  pull_request:
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  push:
    branches: [main]
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-improvement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/evidenceIntegrity/recursiveImprovement.test.ts
      - run: pnpm exec tsc --noEmit
