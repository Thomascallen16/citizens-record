name: Recursive Evidence Improvement

on:
  pull_request:
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  push:
    branches: [main]
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-improvement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/evidenceIntegrity/recursiveImprovement.test.ts
      - run: pnpm exec tsc --noEmit
