name: Recursive Evidence Improvement

on:
  pull_request:
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  push:
    branches: [main]
    paths:
      - "server/evidenceIntegrity/**"
      - "docs/RECURSIVE_IMPROVEMENT.md"
      - ".github/workflows/recursive-improvement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recursive-improvement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/evidenceIntegrity/recursiveImprovement.test.ts
      - run: pnpm exec tsc --noEmit
