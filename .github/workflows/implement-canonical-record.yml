name: One-time canonical workflow integration
on:
  push:
    branches: [feature/canonical-record-workflow]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Patch integration points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/routers.ts')
          s = p.read_text()
          if 'from "./canonicalRecord"' not in s:
              marker = 'import { systemRouter } from "./_core/systemRouter";\n'
              s = s.replace(marker, marker + 'import { canonicalRouter } from "./canonicalRecord";\n')
          s = s.replace('export const appRouter = router({\n  system: systemRouter,', 'export const appRouter = router({\n  system: systemRouter,\n  canonical: canonicalRouter,')
          p.write_text(s)

          p = Path('server/canonicalRecord.ts')
          s = p.read_text()
          if 'import { canonicalAuditEvents } from "../drizzle/canonicalAudit";' not in s:
              s = s.replace('import { protectedProcedure, router } from "./_core/trpc";\n', 'import { protectedProcedure, router } from "./_core/trpc";\nimport { canonicalAuditEvents } from "../drizzle/canonicalAudit";\n')
          s = s.replace('(await import("../drizzle/canonical")).canonicalAuditEvents', 'canonicalAuditEvents')
          if 'audit: router({' not in s:
              needle = '\n  unknowns: router({'
              audit = '''\n  audit: router({\n    list: protectedProcedure.input(recordId).query(async ({ ctx, input }) => {\n      await ownedCase(ctx.user.id, input.recordId);\n      const db = await dbOrThrow();\n      return db.select().from(canonicalAuditEvents).where(and(eq(canonicalAuditEvents.caseId, input.recordId), eq(canonicalAuditEvents.userId, ctx.user.id))).orderBy(desc(canonicalAuditEvents.occurredAt));\n    }),\n  }),'''
              s = s.replace(needle, audit + needle)
          p.write_text(s)

          p = Path('client/src/App.tsx')
          s = p.read_text()
          if 'RecordWorkspace' not in s:
              s = s.replace('import Home from "./pages/Home";\n', 'import Home from "./pages/Home";\nimport RecordWorkspace from "./pages/RecordWorkspace";\n')
              s = s.replace('      <Route path={"/"} component={Home} />', '      <Route path={"/record"} component={RecordWorkspace} />\n      <Route path={"/"} component={Home} />')
          p.write_text(s)

          # Keep the existing documentation as the authoritative history and append implementation notes once.
          p = Path('README.md')
          s = p.read_text()
          if '## Canonical Evidence-First Record Workflow' not in s:
              s += '''\n\n## Canonical Evidence-First Record Workflow\n\nThe authenticated `/record` workspace provides the private Question → Source → Evidence → Claim → Finding → Unknown workflow. Records are private by default and ownership is enforced server-side.\n\n### Local setup\n\n1. Install Node.js and pnpm 10.\n2. Copy `.env.example` to a local environment file and provide the required OAuth, database, and storage configuration.\n3. Ensure `DATABASE_URL` points to a MySQL-compatible database.\n4. Run migrations with `pnpm db:push` for local development; production changes should be applied through the checked-in Drizzle migrations rather than schema push.\n5. Run `pnpm check`, `pnpm test`, and `pnpm build`.\n\nClaims remain assertions. Evidence points to a source and locator. Findings explicitly declare an epistemic category; FACT requires supporting evidence. Unknowns remain visible instead of being converted into conclusions.\n'''
          p.write_text(s)

          for name, heading in [
              ('docs/ARCHITECTURE.md', '## Implementation Pass 1 — Canonical Record Workflow'),
              ('docs/DECISIONS.md', '## Implementation Pass 1 Compatibility Note'),
              ('docs/MVP-ROADMAP.md', '## Implementation Pass 1 Status')]:
              p = Path(name); s = p.read_text()
              if heading not in s:
                  if name.endswith('ARCHITECTURE.md'):
                      s += '''\n\n## Implementation Pass 1 — Canonical Record Workflow\n\nImplemented on feature/canonical-record-workflow: the existing `legal_cases` table remains the storage-compatible case/workspace anchor while `record_metadata` supplies the user-facing Record title, context, verbatim original question, lifecycle status, and private visibility. Existing `source_records` and `source_excerpts` are reused for sources and source-backed evidence, with small canonical metadata extensions. Claims, findings, unknowns, normalized evidence/source/claim/finding links, and canonical audit events are additive models.\n\nThe canonical epistemic vocabulary is FACT, AUTHORITY, CLAIM, INFERENCE, CONTRADICTION, QUESTION, UNKNOWN. Existing confidence values remain separate reliability/verification markers and are never treated as epistemic categories.\n'''
                  elif name.endswith('DECISIONS.md'):
                      s += '''\n\n## Implementation Pass 1 Compatibility Note\n\nRetained: `legal_cases`, `case_members`, `source_records`, `source_excerpts`, `evidence_items`, `chronology_events`, `citations`, and the existing revision/audit foundation. Extended through additive canonical metadata/link tables rather than replacing existing records.\n\nThe user-facing term is Record; `legal_cases` remains the compatible storage anchor. New records create both the legacy case row and canonical `record_metadata`. Existing cases continue to load through a legacy fallback when canonical metadata is absent. Existing confidence values (`PRIMARY-RECORD`, `USER-REPORTED`, `VERIFY`, `SOURCE-UNAVAILABLE`, `CONFLICTING`) remain distinct from epistemic category.\n'''
                  else:
                      s += '''\n\n## Implementation Pass 1 Status\n\nComplete on the feature branch: canonical private Record metadata, source-backed evidence, claims, findings, unknowns, normalized traceability links, server-enforced ownership checks, FACT-with-evidence validation, and canonical audit events.\n\nNext implementation pass: provenance/versioning, timeline integration, entity relationships, and deliberate public publishing.\n'''
                  p.write_text(s)

          Path('.github/workflows/implement-canonical-record.yml').unlink()
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: integrate canonical record workflow"
          git push
