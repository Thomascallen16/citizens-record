name: Autopilot Portable Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portable-engine/**"
      - ".github/workflows/autopilot-portable-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.3"
      - name: Run portable engine tests
        run: python -m unittest discover -s portable-engine -p "test_*.py" -v
      - name: Syntax-check engine
        run: python -m py_compile portable-engine/engine.py
      - name: Build standalone executable
        run: pyinstaller --clean --onefile --name Autopilot portable-engine/engine.py
      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Autopilot | Out-Null
          Copy-Item dist/Autopilot.exe package/Autopilot/Autopilot.exe
          Copy-Item portable-engine/PORTABLE_BUILD.md package/Autopilot/README.txt
          New-Item -ItemType Directory -Force -Path package/Autopilot/tools/bento4, package/Autopilot/output, package/Autopilot/state/receipts | Out-Null
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Starting Autopilot...
          echo.
          Autopilot.exe
          set "EXITCODE=%ERRORLEVEL%"
          echo.
          echo Startup receipt folder: state\receipts
          if not "%EXITCODE%"=="0" echo Autopilot exited with code %EXITCODE%.
          echo.
          pause
          exit /b %EXITCODE%
          '@ | Set-Content package/Autopilot/launch.bat
          @'
          Bento4 tools are not bundled in this development artifact.
          This package does not bypass DRM or access controls.
          '@ | Set-Content package/Autopilot/tools/bento4/README.txt
      - name: Smoke test packaged executable and receipt
        shell: pwsh
        run: |
          & package/Autopilot/Autopilot.exe
          if ($LASTEXITCODE -ne 0) { throw "Autopilot executable failed with exit code $LASTEXITCODE" }
          $receipt = Get-ChildItem package/Autopilot/state/receipts -Filter "*.json" | Select-Object -First 1
          if (-not $receipt) { throw "Startup receipt was not written beside the executable" }
          & package/Autopilot/Autopilot.exe --verify-receipt $receipt.FullName
          if ($LASTEXITCODE -ne 0) { throw "Packaged receipt failed integrity verification" }
      - name: Verify launcher preserves Python failure exit code
        shell: pwsh
        run: |
          $fakeBin = Join-Path $env:RUNNER_TEMP "autopilot-fake-python"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          Set-Content -Path (Join-Path $fakeBin "py.cmd") -Value ('@echo off' + [Environment]::NewLine + 'exit /b 7')
          $oldPath = $env:PATH
          try {
            $env:PATH = "$fakeBin;$oldPath"
            $launcher = (Resolve-Path "portable-engine/launch.bat").Path
            & cmd.exe /d /c ('"' + $launcher + '"')
            if ($LASTEXITCODE -ne 7) { throw "Launcher returned $LASTEXITCODE instead of preserving Python exit code 7" }
          }
          finally {
            $env:PATH = $oldPath
          }
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Autopilot-Windows-x64
          path: package/Autopilot/
          if-no-files-found: error
          retention-days: 14
