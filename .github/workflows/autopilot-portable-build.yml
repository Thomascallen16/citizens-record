name: Autopilot Portable Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "portable-engine/**"
      - ".github/workflows/autopilot-portable-build.yml"
  pull_request:
    paths:
      - "portable-engine/**"
      - ".github/workflows/autopilot-portable-build.yml"

permissions:
  contents: read

concurrency:
  group: autopilot-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run portable engine and Pocket Buddy tests
        run: python -m unittest discover -s portable-engine/tests -v
      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Syntax-check Python modules
        run: python -m py_compile portable-engine/engine.py portable-engine/pocket_buddy.py
      - name: Build standalone engine executable
        run: pyinstaller --clean --onefile --name Autopilot portable-engine/engine.py
      - name: Build Pocket Buddy desktop executable
        run: pyinstaller --clean --onefile --windowed --name PocketBuddy portable-engine/pocket_buddy.py
      - name: Smoke test engine executable
        run: ./dist/Autopilot.exe
      - name: Verify packaged startup writes receipt beside executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & package/Autopilot/Autopilot.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged Autopilot.exe exited with code $LASTEXITCODE" }
          $receipts = Get-ChildItem package/Autopilot/state/receipts -Filter "*.json"
          if (-not $receipts) { throw "No startup receipt was created beside the packaged executable" }
      - name: Assemble portable folder and ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path package/Autopilot | Out-Null
          Copy-Item dist/Autopilot.exe package/Autopilot/Autopilot.exe
          Copy-Item dist/PocketBuddy.exe package/Autopilot/PocketBuddy.exe
          Copy-Item portable-engine/PORTABLE_BUILD.md package/Autopilot/README.txt
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo.
          echo Big Data Energy - Autopilot
          echo Starting portable engine...
          echo.
          Autopilot.exe
          set "engine_exit=%errorlevel%"
          echo.
          echo Startup records are stored in state\receipts beside this program.
          if not "%engine_exit%"=="0" echo Autopilot exited with error code %engine_exit%.
          echo.
          pause
          exit /b %engine_exit%
          '@ | Set-Content package/Autopilot/Launch-Autopilot.bat
          New-Item -ItemType Directory -Force -Path package/Autopilot/tools/bento4, package/Autopilot/models, package/Autopilot/output, package/Autopilot/state/receipts | Out-Null
          @'
          POCKET BUDDY QUICK START
          1. Install Ollama on this Windows computer.
          2. In a terminal, run: ollama pull qwen2.5:3b
          3. Start Ollama, then double-click PocketBuddy.exe.
          Chat requests go only to 127.0.0.1 on this computer.
          Conversation history is saved under state/chat_history.json beside this executable.
          The model itself is not included in this ZIP.
          '@ | Set-Content package/Autopilot/QUICK_START.txt
          @'
          Bento4 tools are not bundled in this development artifact.
          Media inspection requiring Bento4 is unavailable until compatible binaries are supplied.
          '@ | Set-Content package/Autopilot/tools/bento4/README.txt
          @'
          No language model is included in this folder.
          Ollama is the current local runtime dependency for chat.
          '@ | Set-Content package/Autopilot/models/README.txt
          $exeHash = (Get-FileHash package/Autopilot/Autopilot.exe -Algorithm SHA256).Hash.ToLower()
          $chatHash = (Get-FileHash package/Autopilot/PocketBuddy.exe -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            product = "Pocket Buddy / Big Data Energy"
            version = "0.2.0-preview"
            target = "windows-x64"
            engine_executable = "Autopilot.exe"
            engine_sha256 = $exeHash
            chat_executable = "PocketBuddy.exe"
            chat_sha256 = $chatHash
            source_commit = "${{ github.sha }}"
            chat_runtime = "Ollama on localhost"
            model_included = $false
            bento4_included = $false
          }
          $manifest | ConvertTo-Json | Set-Content package/Autopilot/manifest.json
          Compress-Archive -Path package/Autopilot/* -DestinationPath dist/Autopilot-Windows-x64.zip -Force
      - name: Upload portable folder and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Autopilot-Windows-x64
          path: |
            dist/Autopilot-Windows-x64.zip
            package/Autopilot/
          if-no-files-found: error
          retention-days: 30
